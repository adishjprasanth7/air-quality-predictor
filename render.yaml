services:
  - type: web
    name: aerovision
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerovision-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: aerovision-db
    databaseName: aerovision
    user: aerovision
    plan: 0.1c-256mb
